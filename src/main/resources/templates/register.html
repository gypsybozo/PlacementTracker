<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Coding Placement Tracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h2>Register</h2>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <label>Username:</label>
        <input type="text" th:field="*{username}" required/><br>
    
        <label>Email:</label>
        <input type="email" th:field="*{email}" required/><br>
    
        <label>Password:</label>
        <input type="password" th:field="*{password}" required/><br>
    
        <label>Confirm Password:</label>
        <input type="password" th:field="*{confirmPassword}" required/><br>
    
        <button type="submit">Register</button>
        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

    </form>
    
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <p th:if="${message}" class="success" th:text="${message}"></p>
    

    <p th:if="${error}" class="error" th:text="${error}"></p>
</div>
</body>
</html>
