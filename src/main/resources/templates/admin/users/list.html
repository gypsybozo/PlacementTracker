<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - Coding Placement Tracker</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
            <ul class="nav-links">
                <li><a th:href="@{/admin/dashboard}"><span class="icon">📊</span> Dashboard</a></li>
                <li class="active"><a th:href="@{/admin/users}"><span class="icon">👥</span> Users</a></li>
                <li><a th:href="@{/admin/jobs/manage}"><span class="icon">🏢</span> Jobs</a></li>
                <li><a th:href="@{/admin/notifications}"><span class="icon">🔔</span> Notifications</a></li>
                <li><a th:href="@{/dashboard}"><span class="icon">🏠</span> Main Site</a></li>

            </ul>
            <div class="logout">
                <a th:href="@{/logout}"><span class="icon">🚪</span> Logout</a>
            </div>
        </nav>
        
        <main class="content">
            <header>
                <div class="header-container">
                    <h1>Manage Users</h1>
                </div>
                
                <div th:if="${param.success}" class="alert alert-success">
                    <p th:text="${param.success == 'statusupdated'} ? 'User status updated successfully!' : 
                        (${param.success == 'roleassigned'} ? 'Admin role assigned successfully!' : 
                        (${param.success == 'roleremoved'} ? 'Admin role removed successfully!' : 
                        (${param.success == 'deleted'} ? 'User deleted successfully!' : 'Operation completed successfully!')))">
                        Success message
                    </p>
                </div>
                
                <div th:if="${param.error}" class="alert alert-danger">
                    <p th:text="${param.error == 'notfound'} ? 'User not found!' : 'An error occurred!'">Error message</p>
                </div>
            </header>
            
            <section class="users-table">
                <div th:if="${users.empty}" class="no-data">
                    <p>No users found.</p>
                </div>
                
                <table th:if="${!users.empty}" class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Roles</th>
                            <th>Created</th>
                            <th>Last Login</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.username}">username</td>
                            <td th:text="${user.email}">user@example.com</td>
                            <td>
                                <span th:if="${user.enabled}" class="status-badge status-active">Active</span>
                                <span th:unless="${user.enabled}" class="status-badge status-inactive">Inactive</span>
                            </td>
                            <td>
                                <span th:each="role : ${user.roles}" class="role-badge" 
                                th:text="${#strings.length(role) > 5 ? role.substring(5) : role}">ROLE</span>
                            </td>
                            <td th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">01 Jan 2025</td>
                            <td th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin, 'dd MMM yyyy') : 'Never'}">01 Jan 2025</td>
                            <td class="actions">
                                <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-small btn-info">View</a>
                                
                                <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-small" 
                                            th:classappend="${user.enabled ? 'btn-warning' : 'btn-success'}"
                                            th:text="${user.enabled ? 'Disable' : 'Enable'}">
                                        Toggle
                                    </button>
                                </form>
                                
                                <form th:if="${!user.roles.contains('ROLE_ADMIN')}" 
                                      th:action="@{/admin/users/{id}/make-admin(id=${user.id})}" 
                                      method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-small btn-primary">Make Admin</button>
                                </form>
                                
                                <form th:if="${user.roles.contains('ROLE_ADMIN')}" 
                                      th:action="@{/admin/users/{id}/remove-admin(id=${user.id})}" 
                                      method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-small btn-warning">Remove Admin</button>
                                </form>
                                
                                <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" 
                                      style="display: inline;"
                                      onsubmit="return confirm('Are you sure you want to delete this user?');">
                                    <button type="submit" class="btn btn-small btn-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
