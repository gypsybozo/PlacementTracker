<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'User: ' + ${user.username} + ' - Coding Placement Tracker'">User Details - Coding Placement Tracker</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
            <ul class="nav-links">
                <li><a th:href="@{/admin/dashboard}"><span class="icon">📊</span> Dashboard</a></li>
                <li class="active"><a th:href="@{/admin/users}"><span class="icon">👥</span> Users</a></li>
                <li><a th:href="@{/admin/jobs/manage}"><span class="icon">🏢</span> Jobs</a></li>
                <li><a th:href="@{/admin/notifications}"><span class="icon">🔔</span> Notifications</a></li>
                <li><a th:href="@{/dashboard}"><span class="icon">🏠</span> Main Site</a></li>
            </ul>
            <div class="logout">
                <a th:href="@{/logout}"><span class="icon">🚪</span> Logout</a>
            </div>
        </nav>
        
        <main class="content">
            <header>
                <div class="header-container">
                    <a th:href="@{/admin/users}" class="back-link">&larr; Back to Users</a>
                    <h1 th:text="'User: ' + ${user.username}">User Details</h1>
                </div>
            </header>
            
            <section class="user-details">
                <div class="user-info-card">
                    <div class="user-header">
                        <h2 th:text="${user.username}">Username</h2>
                        <div class="user-status">
                            <span th:if="${user.enabled}" class="status-badge status-active">Active</span>
                            <span th:unless="${user.enabled}" class="status-badge status-inactive">Inactive</span>
                        </div>
                    </div>
                    
                    <div class="user-roles">
                        <span th:each="role : ${user.roles}" class="role-badge" 
                              th:text="${role.substring(5)}">ROLE</span>
                    </div>
                    
                    <div class="user-contact">
                        <p><strong>Email:</strong> <span th:text="${user.email}">user@example.com</span></p>
                    </div>
                    
                    <div class="user-dates">
                        <p><strong>Created:</strong> <span th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy HH:mm')}">01 Jan 2025</span></p>
                        <p><strong>Last Login:</strong> <span th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin, 'dd MMM yyyy HH:mm') : 'Never'}">Never</span></p>
                    </div>
                    
                    <div class="user-actions">
                        <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post" style="display: inline;">
                            <button type="submit" class="btn" 
                                    th:classappend="${user.enabled ? 'btn-warning' : 'btn-success'}"
                                    th:text="${user.enabled ? 'Disable Account' : 'Enable Account'}">
                                Toggle Status
                            </button>
                        </form>
                        
                        <form th:if="${!user.roles.contains('ROLE_ADMIN')}" 
                              th:action="@{/admin/users/{id}/make-admin(id=${user.id})}" 
                              method="post" style="display: inline;">
                            <button type="submit" class="btn btn-primary">Make Admin</button>
                        </form>
                        
                        <form th:if="${user.roles.contains('ROLE_ADMIN')}" 
                              th:action="@{/admin/users/{id}/remove-admin(id=${user.id})}" 
                              method="post" style="display: inline;">
                            <button type="submit" class="btn btn-warning">Remove Admin</button>
                        </form>
                        
                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" 
                              onsubmit="return confirm('Are you sure you want to delete this user? This action cannot be undone.');">
                            <button type="submit" class="btn btn-danger">Delete User</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
