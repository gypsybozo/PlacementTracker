<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Job - Coding Placement Tracker</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
            <ul class="nav-links">
                <li><a th:href="@{/admin/dashboard}"><span class="icon">📊</span> Dashboard</a></li>
                <li><a th:href="@{/admin/users}"><span class="icon">👥</span> Users</a></li>
                <li class="active"><a th:href="@{/admin/jobs/list}"><span class="icon">💼</span> Jobs</a></li>
                <li><a th:href="@{/admin/notifications/send}"><span class="icon">🔔</span> Notifications</a></li>
                <li><a th:href="@{/dashboard}"><span class="icon">🏠</span> Main Site</a></li>
            </ul>
            <div class="logout">
                <a th:href="@{/logout}"><span class="icon">🚪</span> Logout</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="content">
            <header>
                <div class="header-container">
                    <h1>Edit Job</h1>
                    <div class="header-actions">
                        <a th:href="@{/admin/jobs/list}" class="btn btn-secondary">Back to Jobs</a>
                    </div>
                </div>
            </header>
            
            <section class="job-form-container">
                <form th:action="@{/admin/jobs/update/{id}(id=${job.id})}" th:object="${job}" method="post">
                    <div class="form-group">
                        <label>Title:</label>
                        <input type="text" th:field="*{title}" required />
                    </div>
                    
                    <div class="form-group">
                        <label>Company:</label>
                        <input type="text" th:field="*{company}" required />
                    </div>
                    
                    <div class="form-group">
                        <label>Description:</label>
                        <textarea th:field="*{description}" rows="6" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Location:</label>
                        <input type="text" th:field="*{location}" required />
                    </div>
                    
                    <div class="form-group">
                        <label>Skills Required:</label>
                        <textarea th:field="*{skillsRequired}" rows="4"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Experience (Years):</label>
                        <input type="number" th:field="*{experienceYears}" />
                    </div>
                    
                    <div class="form-group">
                        <label>Salary Range:</label>
                        <input type="text" th:field="*{salaryRange}" />
                    </div>
                    
                    <div class="form-group">
                        <label>Application Deadline:</label>
                        <input type="datetime-local" th:field="*{applicationDeadline}" />
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <label>Status:</label>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" th:field="*{active}" />
                            <span>Active</span>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a th:href="@{/admin/jobs/list}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
