<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Jobs - Coding Placement Tracker</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
            <ul class="nav-links">
                <li><a th:href="@{/admin/dashboard}"><span class="icon">📊</span> Dashboard</a></li>
                <li><a th:href="@{/admin/users}"><span class="icon">👥</span> Users</a></li>
                <li class="active"><a th:href="@{/admin/jobs/list}"><span class="icon">💼</span> Jobs</a></li>
                <li><a th:href="@{/admin/notifications/send}"><span class="icon">🔔</span> Notifications</a></li>
                <li><a th:href="@{/dashboard}"><span class="icon">🏠</span> Main Site</a></li>
            </ul>
            <div class="logout">
                <a th:href="@{/logout}"><span class="icon">🚪</span> Logout</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="content">
            <header>
                <div class="header-container">
                    <h1>Manage Jobs</h1>
                    <div class="header-actions">
                        <a th:href="@{/admin/jobs/manage}" class="btn btn-primary">Add New Job</a>
                    </div>
                </div>
                
                <div th:if="${param.success}" class="alert success">
                    <p th:text="${param.success == 'created'} ? 'Job created successfully!' : 
                              (${param.success == 'updated'} ? 'Job updated successfully!' : 
                              (${param.success == 'deleted'} ? 'Job deleted successfully!' : 'Operation successful!'))">
                        Success message
                    </p>
                </div>
                
                <div th:if="${param.error}" class="alert error">
                    <p th:text="${param.error == 'notfound'} ? 'Job not found!' : 'Operation failed!'">
                        Error message
                    </p>
                </div>
            </header>
            
            <section class="jobs-table-container">
                <table class="jobs-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Company</th>
                            <th>Location</th>
                            <th>Posted Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="job : ${jobs}">
                            <td th:text="${job.id}">1</td>
                            <td th:text="${job.title}">Job Title</td>
                            <td th:text="${job.company}">Company Name</td>
                            <td th:text="${job.location}">Location</td>
                            <td th:text="${#temporals.format(job.postedDate, 'dd MMM yyyy')}">01 Jan 2023</td>
                            <td>
                                <span th:if="${job.active}" class="status-badge active">Active</span>
                                <span th:unless="${job.active}" class="status-badge inactive">Inactive</span>
                            </td>
                            <td class="actions">
                                <a th:href="@{/admin/jobs/edit/{id}(id=${job.id})}" class="btn btn-small btn-edit">Edit</a>
                                <a th:href="@{/jobs/view/{id}(id=${job.id})}" class="btn btn-small btn-view">View</a>
                                <form th:action="@{/admin/jobs/delete/{id}(id=${job.id})}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-small btn-delete" 
                                            onclick="return confirm('Are you sure you want to delete this job?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${jobs.empty}">
                            <td colspan="7" class="no-data">No jobs found</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
