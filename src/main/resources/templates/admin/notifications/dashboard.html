<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications - Coding Placement Tracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
            <ul class="nav-links">
                <li><a th:href="@{/admin/dashboard}"><span class="icon">📊</span> Dashboard</a></li>
                <li><a th:href="@{/admin/users}"><span class="icon">👥</span> Users</a></li>
                <li><a th:href="@{/admin/jobs/manage}"><span class="icon">🏢</span> Jobs</a></li>
                <li class="active"><a th:href="@{/admin/notifications}"><span class="icon">🔔</span> Notifications</a></li>
                <li><a th:href="@{/dashboard}"><span class="icon">🏠</span> Main Site</a></li>
            </ul>
            <div class="logout">
                <a th:href="@{/logout}"><span class="icon">🚪</span> Logout</a>
            </div>
        </nav>
        
        <main class="content">
            <header>
                <div class="header-container">
                    <h1>Notification System</h1>
                </div>
                
                <div th:if="${param.success}" class="alert alert-success">
                    <p th:text="${param.success == 'sent'} ? 'Notification sent successfully!' : 'Operation completed successfully!'">Success message</p>
                </div>
            </header>
            
            <section class="notification-options">
                <div class="notification-card">
                    <h3>Send A Notification</h3>
                    <p>Notify all registered users about important updates or announcements.</p>
                    <a th:href="@{/admin/notifications/send}" class="btn btn-primary">Send to All</a>
                </div>
                
                <!--<div class="notification-card">
                    <h3>Job Notifications</h3>
                    <p>Notify users about new job opportunities matching their preferences.</p>
                    <a th:href="@{/admin/notifications/send?type=job}" class="btn btn-primary">Send Job Alert</a>
                </div>-->
            </section>
        </main>
    </div>
</body>
</html>
