<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Invite to Group</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #4c6ef5;
            --primary-light: #e7ebff;
            --secondary: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --light: #f8f9fa;
            --dark: #343a40;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 8px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fb;
            color: #333;
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        
        .header {
            margin-bottom: 2rem;
        }
        
        .invite-card {
            background-color: var(--white);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn:hover {
            background-color: #3a56c5;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        
        .btn-outline:hover {
            background-color: var(--primary-light);
        }
        
        .info-block {
            background-color: var(--primary-light);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
            justify-content: center;
        }
        
        .code-block {
            background-color: #f1f3f5;
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        
        .qr-container {
            margin: 2rem 0;
        }
        
        .qr-code {
            border: 10px solid white;
            border-radius: 10px;
            box-shadow: var(--shadow);
            max-width: 200px;
            margin: 0 auto;
        }
        
        .section-title {
            margin-bottom: 1rem;
            color: var(--dark);
            font-size: 1.25rem;
        }
        
        .divider {
            height: 1px;
            background-color: #eee;
            margin: 1.5rem 0;
        }
        
        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--success);
            color: white;
            padding: 1rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        
        .show-notification {
            opacity: 1;
        }
    </style>
    <script>
        function copyToClipboard() {
            const link = document.getElementById("inviteLink");
            navigator.clipboard.writeText(link.textContent);
            
            const notification = document.getElementById("copyNotification");
            notification.classList.add("show-notification");
            
            setTimeout(() => {
                notification.classList.remove("show-notification");
            }, 2000);
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Invite Members to Your Group</h1>
            <p>Share the invitation code or link with people you want to join your study group</p>
        </div>

        <div class="invite-card">
            <div class="section-title">
                <i class="fas fa-ticket-alt"></i> Invitation Code
            </div>
            <div class="info-block">
                <div class="code-block">
                    <code th:text="${group.invitationCode}">CODE1234</code>
                </div>
            </div>

            <div class="divider"></div>

            <div class="section-title">
                <i class="fas fa-link"></i> Invitation Link
            </div>
            <div class="info-block">
                <div class="code-block">
                    <code id="inviteLink" th:text="@{/groups/join/{code}(code=${group.invitationCode})}">/groups/join/CODE1234</code>
                </div>
                <button class="btn" onclick="copyToClipboard()">
                    <i class="fas fa-copy"></i> Copy
                </button>
            </div>

            <div class="divider"></div>

            <div class="section-title">
                <i class="fas fa-qrcode"></i> QR Code
            </div>
            <div class="qr-container">
                <img class="qr-code" th:src="'https://api.qrserver.com/v1/create-qr-code/?data=' + @{/groups/join/{code}(code=${group.invitationCode})}" alt="QR Code" />
            </div>
        </div>

        <a th:href="@{/groups}" class="btn btn-outline">
            <i class="fas fa-arrow-left"></i> Back to Groups
        </a>
    </div>

    <div id="copyNotification" class="copy-notification">
        <i class="fas fa-check-circle"></i> Invitation link copied!
    </div>
</body>
</html>
